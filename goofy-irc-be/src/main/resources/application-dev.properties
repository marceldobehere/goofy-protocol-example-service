# Main Spring Settings
spring.application.name=goofy-irc-be
spring.output.ansi.enabled=always
spring.config.import=optional:file:.env[.properties]

# Main Server Settings
server.port=8090
spring.web.error.include-message=always
spring.devtools.add-properties=true

# General Data
goofy.general.frontend-url=http://localhost:3090
goofy.general.url=http://localhost:8090
goofy.general.name=Goofy IRC (Dev)
goofy.general.description=Goofy IRC Example Service for the Goofy Protocol
goofy.general.contact=Contact: real@mail.com
goofy.general.keypair.type=EC_C25519

# Registration
goofy.register.registrations-allowed=true
goofy.register.check-method=manual

# Max Data sizes
goofy.auth.max-request-bytes=150000000
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB

# Main H2 DB
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:./irc_dev.db;AUTO_SERVER=true
spring.datasource.username=sa
spring.datasource.password=sa

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true